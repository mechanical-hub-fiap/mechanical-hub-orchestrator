# NodePort fixa 30083: mesmo valor do target group/listener do orchestrator no
# NLB interno (variavel `services` do mechanical-hub-infra). Mudar aqui exige
# mudar la junto. So e usada pela consulta operacional GET /transaction/{orderId}
# (spec Etapa 7), se ela for exposta no API Gateway; o servico em si e dirigido
# por mensagens.
apiVersion: v1
kind: Service
metadata:
  name: mechanical-hub-orchestrator-svc
  namespace: production
  labels:
    app: mechanical-hub-orchestrator
    app.kubernetes.io/name: orchestrator
spec:
  type: NodePort
  selector:
    app: mechanical-hub-orchestrator
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30083
