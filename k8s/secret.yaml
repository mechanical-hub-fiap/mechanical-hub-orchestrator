# URI do MongoDB com o usuario do orchestrator. O pipeline le usuario e senha
# do Secret criado pelo mechanical-hub-database (output mongodb_secret_name, no
# namespace mongodb_namespace), monta a URI com host, porta, replica set e banco
# (outputs mongodb_*) e aplica este manifesto via envsubst; o valor nunca fica
# versionado. Write/read concern e readPreference sao fixados no codigo
# (MongoConfig), nao na URI.
apiVersion: v1
kind: Secret
metadata:
  name: mechanical-hub-orchestrator-secrets
  namespace: production
  labels:
    app: mechanical-hub-orchestrator
    app.kubernetes.io/name: orchestrator

type: Opaque
stringData:
  mongodb-uri: "${MONGODB_URI}"
