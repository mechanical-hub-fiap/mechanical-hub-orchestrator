# Entre 1 e 2 replicas (infrastructure.md §3). O relay do outbox tem lider unico
# (ShedLock com lease no MongoDB) e o consumo SQS FIFO e por grupo (orderId),
# entao 2 replicas nao duplicam publicacao nem processamento.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mechanical-hub-orchestrator-hpa
  namespace: production
  labels:
    app: mechanical-hub-orchestrator
    app.kubernetes.io/name: orchestrator

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mechanical-hub-orchestrator

  minReplicas: 1
  maxReplicas: 2

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
