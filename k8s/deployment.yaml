apiVersion: apps/v1
kind: Deployment
metadata:
  name: mechanical-hub-orchestrator
  namespace: production
  labels:
    app: mechanical-hub-orchestrator
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/component: worker

spec:
  # O HPA assume o numero de replicas (1-2) depois do primeiro deploy.
  replicas: 1

  selector:
    matchLabels:
      app: mechanical-hub-orchestrator

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: mechanical-hub-orchestrator
        # Contrato de scrape do mechanical-hub-infra: pod no namespace
        # `production` com app.kubernetes.io/name igual a chave do servico e
        # porta de container chamada `http`.
        app.kubernetes.io/name: orchestrator

    spec:
      # Tempo para terminar a mensagem em processamento e o lote do relay antes
      # do SIGKILL. Mensagem interrompida volta para a fila (visibility 30 s) e
      # e deduplicada pelo messageKey; o lease do ShedLock expira sozinho.
      terminationGracePeriodSeconds: 45
      containers:
        - name: orchestrator
          image: ${ECR_REPOSITORY_URL}:${IMAGE_TAG}
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              name: http

          envFrom:
            - configMapRef:
                name: mechanical-hub-orchestrator-config

          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mechanical-hub-orchestrator-secrets
                  key: mongodb-uri

          # ~1/4 da fatia dos 4 servicos em infrastructure.md §3 (1 vCPU / 3 GiB).
          # O heap e 75% do limite (MaxRAMPercentage no Dockerfile).
          resources:
            requests:
              cpu: "250m"
              memory: "640Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          # Com o agente OpenTelemetry a subida leva ~25 s; a criacao dos
          # indices na subida (MongoIndexInitializer) cabe na folga de 3 min.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness inclui o MongoDB (application.yml): sem banco o pod sai
          # do Service e do target group do NLB, sem ser reiniciado.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

      restartPolicy: Always
